# for more options, see https://docs.rendercv.com/user_guide/yaml_input_structure/design/
design:
  theme: classic
  page:
    size: a4
    top_margin: 1.45cm
    bottom_margin: 1.45cm
    left_margin: 1.65cm
    right_margin: 1.65cm
    show_footer: false
    show_top_note: false
  colors:
    body: rgb(31, 41, 55)
    name: rgb(30, 64, 96)
    headline: rgb(30, 64, 96)
    connections: rgb(75, 85, 99)
    section_titles: rgb(30, 64, 96)
    links: rgb(47, 111, 159)
  typography:
    line_spacing: 0.58em
    alignment: left
    date_and_location_column_alignment: right
    font_family: Source Sans 3
    font_size:
      body: 10pt
      name: 27pt
      headline: 10pt
      connections: 9pt
      section_titles: 1.12em
    small_caps:
      name: false
      headline: false
      connections: false
      section_titles: false
    bold:
      name: true
      headline: false
      connections: false
      section_titles: true
  links:
    underline: false
    show_external_link_icon: false
  header:
    alignment: left
    photo_width: 2.5cm
    photo_position: left
    photo_space_left: 0cm
    photo_space_right: 0.55cm
    space_below_name: 0.18cm
    space_below_headline: 0.18cm
    space_below_connections: 0.55cm
    connections:
      show_icons: true
      separator: ""
      space_between_connections: 0.45cm
      hyperlink: true
  section_titles:
    type: with_partial_line
    line_thickness: 0.5pt
    space_above: 0.42cm
    space_below: 0.20cm
  sections:
    allow_page_break: true
    space_between_regular_entries: 0.72em
    space_between_text_based_entries: 0.32em
    show_time_spans_in: []
  entries:
    date_and_location_width: 3.15cm
    side_space: 0cm
    space_between_columns: 0.38cm
    allow_page_break: false
    short_second_row: false
    degree_width: 0cm
    highlights:
      bullet: "-"
      space_left: 0.34cm
      space_above: 0.08cm
      space_between_items: 0.05cm
      space_between_bullet_and_text: 0.45em
  templates:
    one_line_entry:
      main_column: "**LABEL:** DETAILS"
    education_entry:
      main_column: |-
        **INSTITUTION**
        DEGREE, AREA
        SUMMARY
        HIGHLIGHTS
      degree_column: ""
      date_and_location_column: |-
        DATE
        LOCATION
    normal_entry:
      main_column: |-
        **NAME**
        SUMMARY
        HIGHLIGHTS
      date_and_location_column: DATE
